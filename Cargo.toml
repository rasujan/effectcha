[package]
name = "miniature"
version = "0.1.0"
edition = "2021"
description = "Turn videos into tilt-shift miniatures"

[dependencies]
eframe = "0.29"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.10"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"

# Used by `cargo bundle --release` to produce Miniature.app
[package.metadata.bundle]
name = "Miniature"
identifier = "com.example.miniature"
category = "public.app-category.video"
short_description = "Tilt-shift miniature effect for videos"
